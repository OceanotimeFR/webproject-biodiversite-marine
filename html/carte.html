<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AquaSphere - Accueil</title>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="title-div">
                <img src="../img/AquaSphere.png" class="logo"/>
                <h3 id="site-mission">Préservons la biodiversité marine pour demain</h3>
            </div>
            <div class="h-buttons">
                <nav>
                    <a href="./accueil.html" class="header-button" id="b0">Accueil</a>
                    <a href="./carte.html" class="header-button" id="b1">Carte</a>
                    <a href="./annuaire.html" class="header-button" id="b2">Annuaire</a>
                    <a href="./reseau.html" class="header-button" id="b3">Réseau</a>
                </nav>
            </div>
        </header>
        <main>
            <section class="main-map">
                <div id="map"></div>
                <style>
                    #map{
                        height:450px;
                        width:95%;
                        margin-left: auto;
                        margin-right: auto;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                    }
                </style>
            </section>
        </main>

        
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
    var map = L.map('map').setView([0.0, 0.0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        minZoom:3
    }).addTo(map);

    var southWest = L.latLng(-90, -200);
    var northEast = L.latLng(90, 180);
    var bounds = L.latLngBounds(southWest, northEast);
    map.setMaxBounds(bounds);

    var zonesImportantes = [
        {nom: "Grande Barrière de Corail", coords: [-18.2871, 147.6992], description: "Plus grand récif corallien du monde"},
        {nom: "Parc national marin de Tubbataha", coords: [8.9490, 119.9110], description: "Réserve naturelle avec récifs coralliens"},
        {nom: "Sanctuaire marin de Papahānaumokuākea", coords: [25.7460, -166.5608], description: "L’une des plus grandes zones marines protégées"},
        {nom: "Parc marin de la Mer Rouge", coords: [22.0000, 38.5000], description: "Récifs coralliens riches en biodiversité"},
        {nom: "Réserve naturelle des Galápagos", coords: [-0.9538, -90.9656], description: "Espèces uniques et fragiles"},
        {nom: "Zone marine protégée des îles Phoenix", coords: [-3.5933, -170.9639], description: "Grande diversité d’espèces marines"},
        {nom: "Parc marin de la baie de Monterey", coords: [36.6002, -121.8947], description: "Abondance de mammifères marins et oiseaux"},
        {nom: "Parc national marin de Belize", coords: [17.9000, -87.7500], description: "Récifs coralliens, mangroves, herbiers marins"}
    ];

    zonesImportantes.forEach(function(zone) {
        L.marker(zone.coords).addTo(map)
        .bindPopup("<b>" + zone.nom + "</b><br>" + zone.description);
    });

    </script>

    </body>
    <footer>
        <div>
            <p id="copyright">© 2025 AquaSphere - Tout droit réservé</p>
            <a href="../html/apropos.html">A propos</a>
        </div>
    </footer>
</html>
