<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AquaSphere - Accueil</title>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="title-div">
                <img src="../data/img/AquaSphere.png" class="logo"/>
                <h3 id="site-mission">Préservons la biodiversité marine pour demain</h3>
            </div>
            <div class="h-buttons">
                <nav>
                    <a href="./accueil.html" class="header-button" id="b0">Accueil</a>
                    <a href="./carte.html" class="header-button" id="b1">Carte</a>
                    <a href="./annuaire.html" class="header-button" id="b2">Innovations</a>
                    <a href="./reseau.html" class="header-button" id="b3">Réseau</a>
                    <a href="./enlist.html" class="header-button" id="b4">Nous soutenir</a>
                </nav>
            </div>
        </header>
        <main>
            <style>
                fieldset {
                    margin: 1rem;
                    border: none;
                    border-left: 6px solid var(--main-txt-color);
                    border-right: 6px solid var(--main-txt-color);
                }
                fieldset legend {
                    font-size:25px;
                    font-weight: bold;
                }
                fieldset div {
                    margin-left: 0;
                    margin-right: 0;
                    padding: 1rem;
                }
                fieldset input{
                    border:none;
                    border-radius: 10px;
                    background-color: rgb(203, 210, 229);
                    padding:5px;
                }
                #submitButton{
                    background-color: var(--main-txt-color);
                    border: none;
                    border-radius: 10px;
                    width:15%;
                    height:30px;
                    color:white;
                }
                #submitButton:hover{
                    background-color: #91b3e5;
                    cursor: pointer;
                    color:black;
                }
                fieldset input[type="checkbox"]{
                    width: 15px;
                    height: 15px;
                }
            </style>
            <fieldset>
                <legend>Vos informations</legend>
                <section class="survey">
                    <div>
                        <label>Nom :</label>
                        <input type="text" name="Nom" required/>
                    </div>
                    <div>
                        <label>Prénom :</label>
                        <input type="text" name="Prénom" required/>
                    </div>
                    <div>
                        <label>Mail :</label>
                        <input type="email" name="Mail" required/>
                    </div>
                    <div>
                        <label>Souhaitez-vous être recontacté ? :</label>
                        <input type="checkbox" name="contact" required/>
                        <span class="checkmark"></span>
                    </div>
                    <div>
                        <label>Souhaitez-vous faire une donation ?</label>
                        <input type="checkbox" name="don" required/>
                        <span class="checkmark"></span>
                    </div>
                    
                    <button type="submit" id="submitButton">Envoyer</button>

                </section>
            </fieldset>
        </main>
    </body>
    <footer>
        <div>
            <p id="copyright">© 2025 AquaSphere - Tout droit réservé</p>
            <a href="../html/apropos.html">A propos</a>
        </div>
    </footer>
</html>
