<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AquaSphere - Accueil</title>
        <link rel="stylesheet" href="../css/style.css"/>
    </head>
    <body>
        <header class="site-header">
            <div class="title-div">
                <h1 id="site-title">AquaSphere</h1>
            </div>
            <div class="h-buttons">
                <input type="button" value="Carte" class="header-button" id="b1"/>
                <input type="button" value="Anuaire" class="header-button" id="b2"/>
                <input type="button" value="Réseau" class="header-button" id="b3"/>
            </div>
        </header>
        <main>
            <!--Section Citation-->
            <section class="content-section" id="section-citation">
                <p id="citation">« Pas d'eau, pas de vie. Pas de bleu, pas de vert. » - Sylvia Earle</p>
            </section>

            <!--Section Dev Durable-->
            <section class="content-section" id="section-devd">
                <h2 class="content-title">Importance du Développement Durable</h2>
                <div style="display:flex">
                    <div class="rectangle" id="rect1"></div>
                    <div class="rectangle" id="rect2"></div>
                    <div class="rectangle" id="rect3"></div>
                    <img src="../data/img/"/>
                </div>
            </section>
            
            <!--Section Enjeux-->
            <section class="content-section" id="section-enjeux">
                <h2 class="content-title">Enjeux</h2>
            </section>
            
            <!--Section Actualité-->
            <section class="content-section" id="section-actu">
                <h2 class="content-title">Dernières Actualités</h2>
            </section>

    <footer>
        <div>
            <p id="copyright">© 2025 AquaSphere - Tout droit réservé</p>
