<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AquaSphere - Réseau</title>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="title-div">
                <img src="../data/img/AquaSphere.png" class="logo"/>
                <h3 id="site-mission">Préservons la biodiversité marine pour demain</h3>
            </div>
            <div class="h-buttons">
                <nav>
                    <a href="./accueil.html" class="header-button" id="b0">Accueil</a>
                    <a href="./carte.html" class="header-button" id="b1">Carte</a>
                    <a href="./innovations.html" class="header-button" id="b2">Innovations</a>
                    <a href="./reseau.html" class="header-button" id="b3">Réseau</a>
                    <a href="./enlist.html" class="header-button" id="b4">Nous soutenir</a>
                </nav>
            </div>
            <input type="text" id="globalSearch" placeholder="Rechercher..." />
            <div id="globalSearchResults"></div>
        </header>
        <!-- Barre de recherche -->
            <script type="text/javascript" src="../js/searchbar.js"></script>
        <main>
            <style>
                #section-network{
                    padding-top: 2rem;
                }

                .network-rectangles {
                    display: flex;
                    flex-wrap: wrap; 
                    gap: 20px; 
                    justify-content: center; 
                    align-items: flex-start; 
                }

                .network-rectangle{
                    position: relative;
                    overflow:hidden;
                    z-index: 100;
                }

                .network-rectangle .tooltip {
                    position: fixed;        
                    background-color: #333;    
                    border-left: 6px solid var(--main-txt-color);
                    color: white;            
                    padding: 8px;
                    border-radius: 5px;
                    font-size: 0.9rem;
                    width: auto;    
                    height:auto;      
                    opacity: 0;                 
                    pointer-events: none;    
                    transition: opacity 0.3s ease;
                    white-space: pre-line;     
                    box-shadow: 0 0 10px rgba(0,0,0,0.4);
                    z-index: 1000;
                }

                .network-rectangle:hover .tooltip {
                    opacity: 1;                 
                    pointer-events: auto;      
                }

            </style>
            <section id="section-network">
                <div class="network-rectangles"></div>
            </section>
        </main>
        <script type="text/javascript" src="../js/network.js"></script>
        <script type="text/javascript" src="../js/alerts.js"></script>
        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const hash = decodeURIComponent(window.location.hash.substring(1));
                if (!hash) return;

                // Trouver l'élément avec id = hash
                const target = document.getElementById(hash);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Surbrillance temporaire
                    target.style.backgroundColor = "#fffa8b";
                    setTimeout(() => {
                        target.style.backgroundColor = "";
                    }, 3000);
                }
            });
        </script>
    </body>
    <footer>
        <div>
            <p id="copyright">© 2025 AquaSphere - Tout droit réservé</p>
            <a href="../html/apropos.html">A propos</a>
        </div>
    </footer>
</html>
